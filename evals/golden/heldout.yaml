- id: h011
  class: 3
  # DELIBERATELY EMPTY. Every auth-area pull request merged in Feb or Mar 2026,
  # so the correct answer here is "nothing". This is the PRD §5.2 test in its
  # purest form: a system that invents plausible work, or reaches for the
  # nearest non-empty window, fails outright. The scorer must treat an empty
  # prediction against an empty gold set as a perfect score.
  question: "Which pull requests touching authentication merged in the last three months?"
  as_of: "2026-07-29"
  expect_empty: true
  gold_tools: [merged_prs]
  gold_query:
    {method: merged_prs, args: {since: "2026-04-29", until: "2026-07-29", area: auth}}

