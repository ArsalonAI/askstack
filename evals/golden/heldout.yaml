- id: h015
  class: 6
  # Not issue 701 — that thread backs q050 in questions.yaml, and a held-out
  # set sharing source spans with the tuning set does not measure overfitting.
  question: "Is there a built-in way to read an OAuth2 bearer token from a cookie?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:796#comment-0", "issue:796#comment-1"]
  gold_answer_points:
    - "no built-in scheme reads the token from a cookie"
    - "it requires subclassing the OAuth2 security model to do so"
  gold_tools: [search_issues, search_docs]
