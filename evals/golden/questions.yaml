# askstack golden set — 50 questions. PRD §7.1, TRD §14.1.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ FREEZE RULE                                                             │
# │                                                                         │
# │ No question in this file may be edited once an agent run has been       │
# │ scored against it. Changes require a NEW id; the old one stays.         │
# │                                                                         │
# │ This is what makes "authored before the agent existed" a real claim     │
# │ rather than a slogan. Without it the set drifts, one small edit at a    │
# │ time, toward whatever the agent already happens to do well.             │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Pinned revision: fastapi/fastapi@95f8322ee1dc  (commit date 2026-07-29)
# Every `as_of` is at or before that date, and the runner aborts on violation.
#
# Classes 1-4 are exactly checkable: `gold_query` names a FactsStore call and
# `evals/build_gold.py` computes the answer from the pinned corpus. Do not
# hand-write `gold_entities` here — it is generated into gold_entities.yaml.
#
# Classes 5-6 are interpretive. Their `gold_chunks` were chosen by READING the
# issue threads, never by querying the retriever: candidates were surfaced from
# the facts layer on structural signal alone (comment volume, feature/bug
# labels). Citing what our own retrieval returns would make recall@5 measure
# itself.
#
# Two question shapes are excluded by construction, following the precedent
# PRD §4 sets for sprints:
#   - milestones — FastAPI sets none (0 of 2,325 PRs, 0 of 3,542 issues)
#   - open issues — there is exactly 1; support moved to GitHub Discussions
# See README.md.

