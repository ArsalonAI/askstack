# ═══════════════════════════════════════ class 5 — decision archaeology

- id: q031
  class: 5
  question: "Why wasn't context-manager support added to startup and shutdown events when it was first proposed?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:617#comment-0", "issue:617#comment-1", "issue:617#comment-2"]
  gold_answer_points:
    - "the events were inherited from Starlette almost unmodified"
    - "adding context managers would introduce maintenance burden FastAPI did not carry before"
  gold_tools: [search_issues]

- id: q032
  class: 5
  question: "Why does FastAPI not provide first-class session support?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:754#comment-1", "issue:754#comment-10"]
  gold_answer_points:
    - "maintainability: preference for an implementation powered by Starlette features"
    - "FastAPI would add the dependency-injection and OpenAPI layer rather than the storage"
  gold_tools: [search_issues]

- id: q033
  class: 5
  question: "What changed about dependency cleanup in release 0.106, and why did it break streaming responses?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:11143#comment-0", "issue:11143#comment-1"]
  gold_answer_points:
    - "dependencies with yield now close before the response is sent"
    - "StreamingResponse bodies run after cleanup, so the resource is already gone"
  gold_tools: [search_issues]

- id: q034
  class: 5
  question: "Why was the UUID and dataclass annotation problem not fixed in FastAPI itself?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:10007#comment-1"]
  gold_answer_points:
    - "the behaviour belongs to Pydantic, not FastAPI"
    - "it was tracked upstream in the Pydantic issue tracker"
  gold_tools: [search_issues]

- id: q035
  class: 5
  question: "What was the reasoning against globally customising the 422 validation error response?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:1376#comment-0", "issue:1376#comment-1"]
  gold_answer_points:
    - "a custom exception handler already solves the response shape"
    - "the remaining gap is the OpenAPI documentation, not the runtime behaviour"
  gold_tools: [search_issues]

- id: q036
  class: 5
  question: "Why does FastAPI struggle with Annotated and forward references?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:13056#comment-1"]
  gold_answer_points:
    - "the Dependant is built at route creation, before the forward reference can resolve"
    - "it would need its own annotation-evaluation and rebuild step"
  gold_tools: [search_issues]

- id: q037
  class: 5
  question: "What was the argument for documenting resource setup and teardown properly rather than leaving it to users?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:617#comment-8", "issue:617#comment-9"]
  gold_answer_points:
    - "apps break in expected ways when connections are not released, especially under reload"
    - "the tutorial already covers advanced features, so this belongs there too"
  gold_tools: [search_issues]

- id: q038
  class: 5
  question: "Why did passing UploadFile into a StreamingResponse stop working in 0.106?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:10857#comment-0", "issue:10857#comment-1"]
  gold_answer_points:
    - "the file is closed during dependency cleanup before the stream is consumed"
    - "reads then raise I/O operation on closed file"
  gold_tools: [search_issues]

- id: q039
  class: 5
  question: "What did maintainers say about database connections piling up when middleware and async dependencies are combined?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:4719#comment-0", "issue:4719#comment-1"]
  gold_answer_points:
    - "the regression was traced to a specific release"
    - "connections were not being closed, exhausting the pool"
  gold_tools: [search_issues]

- id: q040
  class: 5
  question: "How was the OpenAPI validation failure after upgrading from 0.98.0 to 0.99.0 resolved?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:9780#comment-0"]
  gold_answer_points:
    - "it was fixed in a patch release"
  gold_tools: [search_issues]

- id: q041
  class: 5
  question: "Why was the jsonable_encoder crash with database Record objects not a FastAPI bug?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:36#comment-0"]
  gold_answer_points:
    - "the Record type lacked __iter__ at the time"
    - "it works once the driver provides that method"
  gold_tools: [search_issues]

- id: q042
  class: 5
  question: "What proposal was made for controlling when a dependency is closed relative to the response?"
  as_of: "2026-07-29"
  gold_chunks: ["issue:11143#comment-10"]
  gold_answer_points:
    - "a flag on Depends selecting cleanup before or after the response"
    - "closing before allows raising HTTPException from cleanup"
  gold_tools: [search_issues]

