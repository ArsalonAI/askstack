  gold_chunks: ["issue:11143#comment-1", "issue:10857#comment-1"]
  gold_answer_points:
    - "not since 0.106 — cleanup runs before the stream is consumed"
    - "the workaround is to acquire the resource inside the endpoint"
  gold_tools: [search_issues]

