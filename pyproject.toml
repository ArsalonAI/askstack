[project]
name = "askstack"
version = "0.1.0"
description = "A memory-first agent that answers an engineering manager's questions about delivery state."
requires-python = ">=3.12,<3.13"
dependencies = [
    # service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # storage — asyncpg on the hot path, psycopg for Alembic's sync engine
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # config and fetch
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyyaml>=6.0",
    # models
    "sentence-transformers>=3.3",
    "anthropic>=0.40",
    # observability — v2 to match the langfuse:2 image in docker-compose.yml
    "langfuse>=2.53,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
