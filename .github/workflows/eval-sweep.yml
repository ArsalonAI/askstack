name: eval-sweep

# The tool-scaling curve — TRD §14.5, §14.6. No API key, no corpus, no cost.
#
# On change rather than on a schedule. With a fixed embedding model and
# prefix-stable padding the sweep returns the same numbers every night, and a
# job that cannot change its answer overnight has no business running
# overnight. It runs when something that *could* change the answer changes.
on:
  push:
    branches: [main]
    paths: &sweep_inputs
      - "app/tools/**"
      - "app/retrieval/embedder.py"
      - "evals/sweep.py"
      - "evals/golden/questions.yaml"
      - "scripts/gen_synthetic_tools.py"
      - ".github/workflows/eval-sweep.yml"
  pull_request:
    paths: *sweep_inputs
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askstack
          POSTGRES_PASSWORD: askstack
          POSTGRES_DB: askstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U askstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://askstack:askstack@localhost:5432/askstack
      ANTHROPIC_API_KEY: ""
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      - name: Migrate
        run: uv run alembic -c scripts/migrations/alembic.ini upgrade head

      # The sweep needs `tool_defs` populated, which needs the catalog and the
      # embedder — but *not* the corpus. That is why this workflow can run on
      # every relevant push while the golden-set gate cannot (see below).
      - name: Seed the tool catalog
        run: uv run python scripts/seed_tools.py

      - name: Run the sweep
        run: uv run python evals/sweep.py --json /tmp/sweep.json

      # Report drift rather than gating on it. The curve is a measurement, not
      # a contract: a change to the embedder is *supposed* to move it, and a
      # red build would only teach people to regenerate the committed file.
      - name: Compare against the committed curve
        run: |
          uv run python - <<'PY'
          import json, pathlib
          new = json.load(open("/tmp/sweep.json"))["points"]
          committed = pathlib.Path("evals/baselines/sweep.json")
          if not committed.is_file():
              print("no committed curve yet"); raise SystemExit(0)
          old = json.load(committed.open())["points"]
          by_size = {p["catalog_size"]: p for p in old}
          print(f"{'catalog':>8}{'recall':>9}{'was':>9}{'delta':>8}")
          for p in new:
              was = by_size.get(p["catalog_size"])
              if was is None:
                  print(f"{p['catalog_size']:>8}{p['tool_recall']:>9.3f}{'—':>9}{'new':>8}")
                  continue
              d = p["tool_recall"] - was["tool_recall"]
              print(f"{p['catalog_size']:>8}{p['tool_recall']:>9.3f}"
                    f"{was['tool_recall']:>9.3f}{d:>+8.3f}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tool-scaling-curve
          path: /tmp/sweep.json

# Not here, deliberately: the golden-set PR gate (§14.6's eval-pr.yml).
# It needs an ingested corpus — ~30 minutes of GitHub API calls — and an
# ANTHROPIC_API_KEY, so it cannot run on a fork or without secrets. §14.6
# specifies restoring the index from a cache keyed on CORPUS_REF; that cache
# does not exist yet, and a workflow that fails on every fork is worse than an
# absent one. It lands with M5.
