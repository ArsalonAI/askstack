services:
  db:
    image: pgvector/pgvector:pg16
    container_name: askstack-db
    environment:
      POSTGRES_USER: askstack
      POSTGRES_PASSWORD: askstack
      POSTGRES_DB: askstack
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askstack -d askstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Langfuse v2 runs standalone against its own Postgres.
  # (v3 additionally requires ClickHouse, Redis, and S3/MinIO — overkill for local dev.)
  langfuse-db:
    image: postgres:16
    container_name: askstack-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: askstack-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"

volumes:
  db_data:
  langfuse_db_data:
